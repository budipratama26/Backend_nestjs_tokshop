name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@4

    - name: Setup Node.js
      uses: actions/setup-node@4
      with:
        node-version: 22
        cache: 'npm'
      
    - name: Install Dependencies
      run: npm ci

    - name: Run Unit Tests
      run: npm run test

    - name: Run Production build
      run: npm run build