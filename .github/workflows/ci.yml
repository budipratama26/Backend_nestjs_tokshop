name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci_test_jwt_secret_tokshop_2026_e2e
      NODE_ENV: test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
      
    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Unit Test
      run: npm run test

    - name: Run E2E Test
      run: npm run test:e2e

    - name: Run Production build
      run: npm run build